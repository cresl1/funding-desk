name: rates
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rates
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gate tests
        run: node --test test/risk.test.js test/engine.test.js
      - name: Fetch funding rates
        run: node scripts/fetch-rates.mjs > /tmp/rates.json && head -c 400 /tmp/rates.json
      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cp /tmp/rates.json /tmp/out/rates.json && cd /tmp/out
          git init -q && git checkout -q -b data
          git config user.name "funding-desk-bot" && git config user.email "actions@users.noreply.github.com"
          git add rates.json && git commit -qm "rates $(date -u +%FT%TZ)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
